<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planificador FIO (UNaM)</title>
  <meta name="description"
    content="Planificador de carreras académico para estudiantes de la Facultad de Ingeniería de Oberá.">
  <meta name="theme-color" content="#1e40af">

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.transparenttextures.com; font-src 'self' https://fonts.gstatic.com;">

  <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
  <link rel="apple-touch-icon" href="/pwa-icon.svg">

  <script>
    (function () {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root">
    <style>
      body {
        margin: 0;
        background-color: #f9fafb;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #111827;
        }
      }

      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 16px;
      }

      .loader-text {
        color: #6b7280;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.025em;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @media (prefers-color-scheme: dark) {
        .loader-spinner {
          border-color: rgba(96, 165, 250, 0.2);
          border-top-color: #60a5fa;
        }

        .loader-text {
          color: #9ca3af;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Cargando Planificador...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
